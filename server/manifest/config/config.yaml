# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":12800"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  path: "./logs"        # Log directory (relative or absolute)
  file: "{Y-m-d}.log"   # Rotate daily
  level: "all"          # Log level: all | debug | info | warning | error
  stdout: true          # Also print logs to stdout
  rotateExpire: "7d"    # Log retention period
  rotateBackup: 10      # Maximum number of retained files
  rotateSize: "50M"     # Maximum size of a single file

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: ""


jwt:
  secret: ""

admin:
  users:
    - username: ""
      password: ""

rsa:
  server:
    public:
    private:
  client:
    public:
    private:

xiaozhi:
  secret_key:
  generate_license_token: