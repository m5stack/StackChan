# Existing JVM and AndroidX configuration (kept unchanged)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Local proxy configuration (127.0.0.1:7897)
# HTTP proxy
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
# HTTPS proxy (required because most Android dependencies use HTTPS)
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# Optional: hosts that bypass the proxy (local/LAN addresses; adjust as needed)
systemProp.http.nonProxyHosts=localhost,127.0.0.1,192.168.*,*.local
systemProp.https.nonProxyHosts=localhost,127.0.0.1,192.168.*,*.local
# Keep the legacy Android DSL so Flutter's Gradle plugin can still use the
# compatibility path that this project depends on.
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
